name: Build desktop application

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[desktop]" pyinstaller
      - name: Test calculation core
        run: python -m unittest discover -s tests -v
      - name: Package desktop application
        run: python -m PyInstaller --noconfirm --onedir --windowed --name OIF-Foundations --collect-data oif --collect-data oif.standards scripts/oif_desktop_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: OIF-Foundations-${{ matrix.os }}
          path: dist/*
